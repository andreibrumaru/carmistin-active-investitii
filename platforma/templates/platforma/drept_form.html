{% extends "platforma/form.html" %}
{% block in_form %}{% if anexe_existente %}
  <div class="mt-3"><div class="small fw-semibold mb-1">Anexe existente ({{ anexe_existente|length }})</div>
  <ul class="list-group list-group-flush small">{% for d in anexe_existente %}<li class="list-group-item py-1"><a href="{% url 'document' d.pk %}" title="{{ d.titlu }}"><i class="bi bi-paperclip"></i> {{ d.titlu }}</a> <span class="text-secondary">{{ d.incarcat_la|date:"d.m.Y" }}</span></li>{% endfor %}</ul></div>
{% endif %}{% endblock %}
{% block scripturi %}
<script>
// Perioada de valabilitate și valoarea lunară apar (și sunt obligatorii) doar pentru chirie, superficie, concesiune, arendă.
(() => {
  const tip = document.getElementById('id_tip');
  if (!tip) return;
  const cuPlata = ['inchiriere', 'superficie', 'concesiune', 'arenda'];
  const denumiri = {inchiriere: 'chiriei', superficie: 'superficiei', concesiune: 'redevenței (concesiunii)', arenda: 'arendei'};
  const camp = id => document.getElementById(id)?.closest('[class*="col-"]');
  const actualizeaza = () => {
    const plata = cuPlata.includes(tip.value);
    ['id_data_inceput', 'id_data_sfarsit', 'id_chirie', 'id_moneda'].forEach(id => { const c = camp(id); if (c) c.style.display = plata ? '' : 'none'; });
    const et = camp('id_chirie')?.querySelector('label');
    if (et && plata) et.innerHTML = `Valoarea lunară a ${denumiri[tip.value]} *`;
    ['id_data_inceput', 'id_data_sfarsit'].forEach(id => {
      const l = camp(id)?.querySelector('label');
      if (l) l.innerHTML = l.textContent.replace(/\s*\*$/, '') + (plata ? ' *' : '');
    });
    const den = camp('id_denumire_act');
    if (den) den.style.display = ['proprietate', 'altul', 'comodat'].includes(tip.value) ? '' : 'none';
  };
  tip.addEventListener('change', actualizeaza);
  actualizeaza();
})();
</script>
{% endblock %}
