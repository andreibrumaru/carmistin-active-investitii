<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autentificare · Carmistin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#14233c">
<form method="post" class="card p-4 shadow" style="width:360px">{% csrf_token %}
  <h4 class="mb-0" style="letter-spacing:.12em">CARMISTIN</h4>
  <p class="text-secondary">Active & Investiții</p>
  {% if form.errors %}<div class="alert alert-danger py-2">Utilizator sau parolă incorecte.</div>{% endif %}
  <label class="form-label">Utilizator (cont de domeniu)</label>
  <input name="username" class="form-control mb-3" autofocus required>
  <label class="form-label">Parolă</label>
  <input type="password" name="password" class="form-control mb-3" required>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100">Autentificare</button>
</form></body></html>
