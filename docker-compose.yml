# Instalare pe serverul propriu: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]

  ollama:   # model AI local; pentru GPU NVIDIA decomentați secțiunea deploy
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes: [ollama:/root/.ollama]
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      OLLAMA_URL: http://ollama:11434
    volumes: [fisiere:/app/date/fisiere]
    depends_on: [db, ollama]

  nginx:
    image: nginx:1.27
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web]

volumes: {pgdata: {}, ollama: {}, fisiere: {}}
